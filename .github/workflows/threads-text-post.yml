name: Threads text post (manual)

# Post hand-written text to Threads (with an optional reply under it),
# outside the article-publishing flow. Text limits: 500 chars each.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Main post text (max 500 chars)"
        required: true
        type: string
      reply_text:
        description: "Optional reply posted under the main post (e.g. an article link)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          POST_TEXT: ${{ inputs.text }}
          REPLY_TEXT: ${{ inputs.reply_text }}
        run: python scripts/threads_text_post.py
