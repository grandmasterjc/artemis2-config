name: Threads token bootstrap (verify + fetch user ID)

# Verifies the current THREADS_ACCESS_TOKEN secret and fetches the THREADS_USER_ID.
# Threads tokens generated via the "Generate Access Token" button on the
# Threads Use Case → Settings page are ALREADY long-lived (60 days).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and fetch user info
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::THREADS_ACCESS_TOKEN secret not set"
            exit 1
          fi

          echo "Calling /me endpoint..."
          me=$(curl -sS "https://graph.threads.net/v1.0/me?fields=id,username,threads_profile_picture_url&access_token=$TOKEN")
          echo "Response: $me"

          user_id=$(echo "$me" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          username=$(echo "$me" | python3 -c "import json,sys; print(json.load(sys.stdin).get('username',''))")

          if [ -z "$user_id" ]; then
            echo "::error::Could not fetch user ID — token may be invalid"
            exit 1
          fi

          mkdir -p /tmp/out
          cat > /tmp/out/threads-credentials.txt <<EOF
          # Threads credentials — copy these into GitHub secrets, then delete this file
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          THREADS_USER_ID=$user_id
          THREADS_USERNAME=$username
          EOF

          echo ""
          echo "=== Result ==="
          echo "Username: $username"
          echo "User ID:  $user_id"
          echo "Token is valid."

      - name: Upload credentials as artifact
        uses: actions/upload-artifact@v4
        with:
          name: threads-user-id
          path: /tmp/out/threads-credentials.txt
          retention-days: 1
