name: Mastodon debug (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token + scopes
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          set +e
          echo "instance host suffix: ${MASTODON_INSTANCE: -10}"
          echo "token length: ${#MASTODON_ACCESS_TOKEN}"
          echo ""
          echo "--- /api/v1/accounts/verify_credentials ---"
          curl -sS -o /tmp/verify.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
            "https://${MASTODON_INSTANCE}/api/v1/accounts/verify_credentials"
          echo "Username: $(python3 -c 'import json;print(json.load(open("/tmp/verify.json")).get("username","(none)"))' 2>/dev/null)"
          echo ""
          echo "--- /api/v1/apps/verify_credentials (shows scopes) ---"
          curl -sS -o /tmp/app.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
            "https://${MASTODON_INSTANCE}/api/v1/apps/verify_credentials"
          cat /tmp/app.json
          echo ""
          echo ""
          echo "--- HEAD /api/v2/media (no body) ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
            "https://${MASTODON_INSTANCE}/api/v2/media"
