name: IG debug (one-shot)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check IG token vs user_id
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python3 <<'PY'
          import os, urllib.request, urllib.error, json
          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "")
          user_id = os.environ.get("INSTAGRAM_USER_ID", "")
          print(f"user_id from secret: '{user_id}'")
          print(f"token length: {len(token)}")
          # 1. Who does the token belong to?
          for path in ["me?fields=id,username,account_type", f"{user_id}?fields=id,username,account_type"]:
              url = f"https://graph.instagram.com/{path}&access_token={token}"
              try:
                  r = urllib.request.urlopen(url, timeout=30)
                  print(f"\n[OK] {path}:")
                  print(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"\n[ERR {e.code}] {path}:")
                  print(e.read().decode()[:400])
          PY
