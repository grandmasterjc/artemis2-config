name: Dashboard refresh

# Diagnostic branch only. Do not merge.
#   mode = stats: read-only GA4 query of push events, printed to the log.
#   mode = test:  sends ONE test notification to the single device whose
#                 push ID is given as "token". Nothing goes to a topic.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stats or test"
        required: true
        default: "stats"
      token:
        description: "Push ID of the one device to test (mode = test)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Push statistics (read-only)
        if: ${{ inputs.mode != 'test' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_ANALYTICS_PROPERTY_ID: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
        run: python scripts/push_diag.py

      # The push ID is read from the event file inside the script. It is
      # deliberately not passed through env or the command line, so it is
      # never printed in this public log.
      - name: Test notification to one device
        if: ${{ inputs.mode == 'test' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/push_test_token.py
