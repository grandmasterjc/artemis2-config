name: Dashboard refresh

# Diagnostic branch only. Do not merge.
#   mode = stats: read-only GA4 query of push events, printed to the log.
#   mode = updates: read-only count of app downloads and updates from
#                 Apple's sales reports, printed to the log.
#   mode = test:  sends ONE test notification to the single device whose
#                 push ID is given as "token". Nothing goes to a topic.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stats, updates, test or topic"
        required: true
        default: "stats"
      token:
        description: "Push ID of the one device to test (mode = test)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Push statistics (read-only)
        if: ${{ inputs.mode == 'stats' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_ANALYTICS_PROPERTY_ID: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
        run: python scripts/push_diag.py

      - name: Downloads and updates from Apple (read-only)
        if: ${{ inputs.mode == 'updates' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_VENDOR_NUMBER: ${{ secrets.APP_STORE_CONNECT_VENDOR_NUMBER }}
        run: python scripts/asc_updates.py

      # The push ID is read from the event file inside the script. It is
      # deliberately not passed through env or the command line, so it is
      # never printed in this public log.
      - name: Test notification to one device
        if: ${{ inputs.mode == 'test' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/push_test_token.py

      # Topic path to one device: a private, random topic that only this
      # device is signed up for. Same rule for the push ID as above.
      - name: Topic test to one device
        if: ${{ inputs.mode == 'topic' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/push_test_topic.py
